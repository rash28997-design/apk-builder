name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.builder.myapp'
      app_url:
        description: 'Website URL or HTML data'
        required: true
        default: 'https://google.com'
      has_icon:
        description: 'Has custom icon uploaded'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Native WebView & Custom Logo Android App
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          APP_DATA: ${{ github.event.inputs.app_url }}
          HAS_ICON: ${{ github.event.inputs.has_icon }}
          CI: true
        run: |
          mkdir -p app_project/www app_project/assets
          cd app_project
          npm init -y
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/android@6.1.0 @capacitor/assets
          
          node -e '
            const fs = require("fs");
            const appName = (process.env.APP_NAME || "MyApp").trim();
            let pkgName = (process.env.PACKAGE_NAME || "com.builder.myapp").trim().toLowerCase().replace(/[^a-z0-9.]/g, "");
            if (!pkgName.includes(".")) pkgName = "com.builder." + pkgName;
            const data = (process.env.APP_DATA || "https://google.com").trim();
            const isUrl = data.startsWith("http://") || data.startsWith("https://");

            const config = {
              appId: pkgName,
              appName: appName,
              webDir: "www",
              android: {
                allowMixedContent: true
              }
            };

            if (isUrl) {
              config.server = {
                url: data,
                cleartext: true,
                androidScheme: "https"
              };
              fs.writeFileSync("www/index.html", "<!DOCTYPE html><html><body style=\"background:#000;\"></body></html>");
            } else {
              fs.writeFileSync("www/index.html", data);
            }

            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
          
          npx cap add android
          
          if [ -f "../custom_icon.png" ]; then
            cp ../custom_icon.png assets/icon-only.png
            cp ../custom_icon.png assets/icon-foreground.png
            cp ../custom_icon.png assets/icon-background.png
            cp ../custom_icon.png assets/splash.png
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: Build Real Android APK
        run: |
          cd app_project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app_project/android/app/build/outputs/apk/debug/app-debug.apk
          
