name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.builder.myapp'
      app_url:
        description: 'Website URL or HTML data'
        required: true
        default: 'https://google.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Dynamic Android WebView Project
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          APP_DATA: ${{ github.event.inputs.app_url }}
          CI: true
        run: |
          mkdir -p app_project/www
          cd app_project
          npm init -y
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/android@6.1.0
          node -e '
            const fs = require("fs");
            const appName = (process.env.APP_NAME || "MyApp").trim();
            let pkgName = (process.env.PACKAGE_NAME || "com.builder.myapp").trim().toLowerCase().replace(/[^a-z0-9.]/g, "");
            if (!pkgName.includes(".")) pkgName = "com.builder." + pkgName;
            const data = process.env.APP_DATA || "https://google.com";
            
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: pkgName,
              appName: appName,
              webDir: "www"
            }, null, 2));

            if (data.trim().startsWith("http://") || data.trim().startsWith("https://")) {
              fs.writeFileSync("www/index.html", `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>window.location.replace(${JSON.stringify(data.trim())});</script></head><body></body></html>`);
            } else {
              fs.writeFileSync("www/index.html", data);
            }
          '
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd app_project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app_project/android/app/build/outputs/apk/debug/app-debug.apk
          
