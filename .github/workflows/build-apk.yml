name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.builder.myapp'
      app_url:
        description: 'Website URL or HTML data'
        required: true
        default: 'https://google.com'
      has_icon:
        description: 'Has custom icon uploaded'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & NPM for Ultra-Fast Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-fast-v3

      - name: Build Native WebView & Dark Grey Launch Android App
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          APP_DATA: ${{ github.event.inputs.app_url }}
          HAS_ICON: ${{ github.event.inputs.has_icon }}
          CI: true
        run: |
          mkdir -p app_project/www app_project/assets
          cd app_project
          npm init -y
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/android@6.1.0 @capacitor/assets --prefer-offline --no-audit --no-fund
          
          node -e '
            const fs = require("fs");
            const appName = (process.env.APP_NAME || "MyApp").trim();
            let pkgName = (process.env.PACKAGE_NAME || "com.builder.myapp").trim().toLowerCase().replace(/[^a-z0-9.]/g, "");
            if (!pkgName.includes(".")) pkgName = "com.builder." + pkgName;
            const data = (process.env.APP_DATA || "https://google.com").trim();
            const isUrl = data.startsWith("http://") || data.startsWith("https://");

            const config = {
              appId: pkgName,
              appName: appName,
              webDir: "www",
              backgroundColor: "#1E1E1E",
              android: {
                allowMixedContent: true,
                backgroundColor: "#1E1E1E"
              },
              plugins: {
                SplashScreen: {
                  launchShowDuration: 0
                }
              }
            };

            if (isUrl) {
              config.server = {
                url: data,
                cleartext: true,
                androidScheme: "https"
              };
              fs.writeFileSync("www/index.html", "<!DOCTYPE html><html><body style=\"background:#1E1E1E;margin:0;\"></body></html>");
            } else {
              fs.writeFileSync("www/index.html", data);
            }

            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
          
          npx cap add android
          
          if [ -f "../custom_icon.png" ]; then
            cp ../custom_icon.png assets/icon-only.png
            cp ../custom_icon.png assets/icon-foreground.png
            cp ../custom_icon.png assets/icon-background.png
            npx capacitor-assets generate --android --iconBackgroundColor '#1E1E1E'
          fi

          # Remove splash screen logo completely & set Dark Grey (#1E1E1E) background
          find android/app/src/main/res -name "*splash*" -type f -delete
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#1E1E1E</item>
                  <item name="colorPrimaryDark">#1E1E1E</item>
                  <item name="colorAccent">#1E1E1E</item>
                  <item name="android:windowBackground">#1E1E1E</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">#1E1E1E</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#1E1E1E</item>
                  <item name="android:windowSplashScreenBackground">#1E1E1E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>
              </style>
          </resources>
          EOF
          
          npx cap sync android

      - name: Build Real Android APK (Fast Mode)
        run: |
          cd app_project/android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Publish Direct HTTPS APK Link & Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          TAG="apk-${{ github.run_id }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-')
          [ -z "$SAFE_NAME" ] && SAFE_NAME="MyApp"
          cp app_project/android/app/build/outputs/apk/debug/app-debug.apk "${SAFE_NAME}.apk"
          gh release create "$TAG" "${SAFE_NAME}.apk" --title "$APP_NAME" --notes "Direct APK"

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app_project/android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          
